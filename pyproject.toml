[build-system]
# XXX: If your project needs other packages to build properly, add them to this list.
# torch is not needed to build the open-source (pure Python) package, but it is
# needed to build the fairinternal kernels. Keep it, so that building those from
# source does not require --no-build-isolation.
requires = ["setuptools >= 64", "torch >= 2.10"]
build-backend = "setuptools.build_meta"

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.usort]
first_party_detection = false

# Files vendored from mslk for the PyTorch SDPA fallback (used when mslk is
# not installed). They are kept identical to mslk's, so our formatters and
# type checker leave them alone.
[tool.ufmt]
excludes = [
    "xformers/ops/fmha/_fallback/attn_bias.py",
    "xformers/ops/fmha/_fallback/attn_bias_utils.py",
]

[[tool.mypy.overrides]]
module = [
    "xformers.ops.fmha._fallback.attn_bias",
    "xformers.ops.fmha._fallback.attn_bias_utils",
]
ignore_errors = true
